name = "cycle-push"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Почасовой cron: напоминания уходят в 12:00 по местному времени устройства (research.md R6).
[triggers]
crons = ["0 * * * *"]

# Создать: npx wrangler kv namespace create SUBS — и вписать id.
[[kv_namespaces]]
binding = "SUBS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
# Публичный VAPID-ключ (base64url, 65 байт) — тот же, что VITE_VAPID_PUBLIC_KEY в приложении.
VAPID_PUBLIC_KEY = "REPLACE_WITH_VAPID_PUBLIC_KEY"
VAPID_SUBJECT = "mailto:REPLACE_WITH_CONTACT_EMAIL"
ALLOWED_ORIGIN = "https://REPLACE_WITH_GITHUB_USER.github.io"

# Секрет (не в репозитории): npx wrangler secret put VAPID_PRIVATE_KEY  — приватный ключ в формате JWK.
